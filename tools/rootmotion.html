<!doctype html>
<meta charset="utf-8"><title>root motion probe</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>
<script type="module">
// Net and peak horizontal travel of the hips / root in each clip (model units; char is ~3 units tall).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const g = await new Promise((ok, bad) => new GLTFLoader().load('../assets/models/anims.glb', ok, undefined, bad));
const out = {};
for (const c of g.animations) {
  const row = { dur: +c.duration.toFixed(2) };
  for (const t of c.tracks) {
    if (!/^(hips|root)\.position$/.test(t.name)) continue;
    const v = t.values, n = v.length / 3;
    let peak = 0, peakY = 0;
    for (let i = 0; i < n; i++) {
      peak = Math.max(peak, Math.hypot(v[i*3] - v[0], v[i*3+2] - v[2]));
      peakY = Math.max(peakY, Math.abs(v[i*3+1] - v[1]));
    }
    row[t.name.split('.')[0]] = { net: +Math.hypot(v[(n-1)*3] - v[0], v[(n-1)*3+2] - v[2]).toFixed(2), peak: +peak.toFixed(2), peakY: +peakY.toFixed(2) };
  }
  out[c.name] = row;
}
window.__report = out;
document.body.textContent = 'done';
</script>
